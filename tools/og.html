<!doctype html>
<!-- The picture shown when a link to jss.live/commons is shared (og.png, 1200 × 630). node tools/og.mjs renders it. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0 }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0082c9; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .left { position: absolute; left: 64px; top: 84px; width: 470px }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -.03em; line-height: 1 }
  p { margin-top: 26px; font-size: 33px; line-height: 1.3; opacity: .97 }
  .tags { position: absolute; left: 64px; bottom: 64px; display: flex; flex-wrap: wrap; gap: 10px; width: 480px }
  .tags span { font-size: 21px; font-weight: 600; padding: 7px 17px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35) }
  .win { position: absolute; left: 572px; top: 92px; width: 760px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 30, 60, .45), 0 0 0 1px rgba(255,255,255,.25) }
  .win img { display: block; width: 100% }
</style></head>
<body>
  <div class="left"><h1>Commons</h1><p>Apps for your Solid pod, in a layout you already know.</p></div>
  <div class="tags"><span>Files</span><span>Photos</span><span>Contacts</span><span>Tasks</span><span>Boards</span><span>Notes</span><span>Polls</span></div>
  <div class="win"><img src="../pictures/files.png" alt=""></div>
</body></html>
